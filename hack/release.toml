# previous release
previous = "v0.10.2"

pre_release = false

[notes]

[notes.a-provider-id]
    title = "In-place updates: the PROVIDER_ID placeholder"
    description = """\
A machine configuration can carry the literal `PROVIDER_ID` where the Machine's provider ID
belongs, such as the kubelet's `provider-id` argument and the KubeletConfig `providerID`. The
infrastructure provider replaces it when it delivers the configuration at provisioning: Cluster
API Provider Tinkerbell writes the Hardware's user data with it replaced. The in-place
`UpdateMachine` hook applied the bootstrap data secret as it was, so every in-place update set
the running kubelet's provider ID to the literal `PROVIDER_ID`. It now replaces the placeholder
with the Machine's `spec.providerID`, and refuses to apply a configuration that carries the
placeholder when the Machine has no provider ID.
"""

[notes.b-deps]
    title = "Dependencies"
    description = """\
No dependency updates.
"""

