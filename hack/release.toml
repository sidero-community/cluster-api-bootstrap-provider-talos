# commit to be tagged for new release
commit = "HEAD"

project_name = "CAPI Bootstrap Provider Talos"
github_repo = "sidero-community/cluster-api-bootstrap-provider-talos"
match_deps = "^github.com/(siderolabs/[a-zA-Z0-9-]+)$"

# previous release
previous = "v0.9.0"

pre_release = false

[notes]

[notes.upstream]
    title = "Upstream sync"
    description = """\
The fork is rebased onto the upstream `siderolabs/cluster-api-bootstrap-provider-talos` main
and takes its fixes: the TalosConfig `Ready` condition is set again, summarizing
`DataSecretAvailable` (it was never set since the move to v1beta2 conditions); the v1alpha3
conversion no longer returns early for objects without a conversion-data annotation, so their
status converts correctly; and the manager role gains the finalizer permissions on TalosConfigs
and Clusters that Cluster API 1.14 expects. Machine configuration patches are no longer logged.
"""

[notes.deps]
    title = "Dependencies"
    description = """\
Kubernetes libraries 0.37.2, controller-runtime 0.25.2, Cluster API 1.14.3, Talos machinery
1.14.5 and yaml.v3.
"""

preface = """\
"""
