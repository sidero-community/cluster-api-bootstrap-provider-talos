# previous release
previous = "v0.10.0"

pre_release = false

[notes]

[notes.a-machineset]
    title = "In-place updates: MachineSet infrastructure templates"
    description = """\
`CanUpdateMachineSet` now absorbs provisioning-time-only infrastructure changes on a
MachineSet, as `CanUpdateMachine` already did for a single Machine. The hook receives the
MachineSet's InfraMachineTemplate, whose kind (`TinkerbellMachineTemplate`) never matched the
machine kind the allowlist is keyed by (`TinkerbellMachine`), so every infrastructure change on a
MachineSet, a Tink template edit included, fell back to a rolling replacement of its machines.
The template's kind is now mapped to the kind it stamps out by dropping the `Template` suffix; a
kind that does not follow that convention is still declined.
"""

[notes.b-deps]
    title = "Dependencies"
    description = """\
No dependency updates.
"""

