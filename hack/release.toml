[notes]

[notes.a-restrict-join]
    title = "Restricting which machines can join"
    description = """\
A TalosConfig can now set `spec.restrictJoin`, which ties joining Kubernetes to a living Cluster
API Machine. The kubelet registers its Node with the label
`bootstrap.cluster.x-k8s.io/talos-join-id`, whose value is the UID of the Machine (or
MachinePool) that owns the configuration. The provider keeps an allowlist of the living owners
in the workload cluster (`kube-system/talos-join-allowlist`) with a ValidatingAdmissionPolicy
that refuses a kubelet registering a Node that is not on it, so a disk that outlives its Machine
cannot register again. A worker owned by a Machine also gets a bootstrap token of its own,
derived from the cluster's Kubernetes CA key and the Machine's UID; its Secret exists in the
workload cluster only while the Machine lives and its Node is not Ready.

The policy refuses only once every living Machine is covered, by a join ID or by an existing
Node; until then it warns and audits. Clusters that never set the field are not touched, and the
policy is removed when the last TalosConfig drops it. The field is absorbed in place.

Limits: the policy needs Kubernetes 1.30 or later; the cluster-wide token stays valid, so a
worker configuration rendered before the field was set can still request a certificate; a
machine holding a living Machine's configuration can register as that Machine; MachinePool
members and user-supplied configurations (`generateType: none`) keep the cluster-wide token. See
"Restricting which machines can join" in the README.
"""

