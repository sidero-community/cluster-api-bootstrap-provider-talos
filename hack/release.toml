pre_release = false

[notes]

[notes.a-tasks]
    title = "In-place updates: TinkerbellMachine tasks and boot options"
    description = """\
Cluster API Provider Tinkerbell v0.10 adds `spec.tasks` to TinkerbellMachine: Tinkerbell v1alpha2
Tasks, inline or by reference, each with its own boot options. CAPT reads them, like
`spec.templateInline` and `spec.bootOptions`, only when it creates a machine's Workflow, so a
running machine is never re-imaged when they change. The in-place allowlist now covers
`spec.tasks` and the whole of `spec.bootOptions`; the boot mode was declined before, on the
wrong assumption that it acts on a running machine. A MachineDeployment can therefore move
from a template to Tasks without rolling out its machines. `spec.addressFromPool` stays
excluded.
"""

[notes.b-deps]
    title = "Dependencies"
    description = """\
No dependency updates.
"""

