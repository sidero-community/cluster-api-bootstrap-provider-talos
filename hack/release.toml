# commit to be tagged for new release
commit = "HEAD"

project_name = "CAPI Bootstrap Provider Talos"
github_repo = "sidero-community/cluster-api-bootstrap-provider-talos"
match_deps = "^github.com/(siderolabs/[a-zA-Z0-9-]+)$"

# previous release
previous = "v0.10.3"

pre_release = false

[notes]

[notes.a-references]
    title = "In-place updates: TinkerbellMachine references and vars"
    description = """\
Cluster API Provider Tinkerbell v0.11 adds `spec.references` and `spec.vars` to
TinkerbellMachine, so that a machine's Tasks can read that machine's own objects, such as the
installer image CABPT pins in its TalosConfig. CAPT reads them, like `spec.tasks`, only when it
creates the machine's Workflow, so a running machine is never re-imaged when they change. The
in-place allowlist now covers both, and changing them no longer rolls the machines out.
"""

[notes.b-removed-keys]
    title = "In-place updates: keys removed inside a field"
    description = """\
The in-place answer set each field it absorbs to its desired value. Cluster API merges that
answer into the current object, so a key removed inside an object field survived, the result
still differed from the desired object, and the machine was rolled out instead: for example
removing `bootOptions.isoURL`, `templateRef.namespace` or `hardwareAffinity.preferred` from a
TinkerbellMachine, a key of a TalosConfig's `imageFactory`, or a reference or var. The answer
now names each removed key with null, so these changes are made in place. A removal inside a
field the extension does not absorb, such as `addressFromPool`, still rolls out.
"""

[notes.c-deps]
    title = "Dependencies"
    description = """\
No dependency updates.
"""

preface = """\
"""
