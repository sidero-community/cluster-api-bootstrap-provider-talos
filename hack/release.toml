# commit to be tagged for new release
commit = "HEAD"

project_name = "CAPI Bootstrap Provider Talos"
github_repo = "siderolabs/cluster-api-bootstrap-provider-talos"
match_deps = "^github.com/(siderolabs/[a-zA-Z0-9-]+)$"

# previous release
previous = "v0.8.2"

pre_release = false

[notes]

[notes.CAPI]
    title = "CAPI"
    description = """\
CABPT is now built against CAPI v1.14 (v1beta2 contract, unchanged), which adds
Kubernetes 1.37 for management and workload clusters. Kubernetes 1.37 workload
clusters need CAPI core v1.14.1 or later on the management cluster.
"""

[notes.talosconfig]
    title = "TalosConfig status.talosConfig removed"
    description = """\
TalosConfig no longer reports a talosconfig in `status.talosConfig`; the field is not part of the
`v1beta1` API and stays empty when read through `v1alpha3`.
Use the cluster-wide `<cluster-name>-talosconfig` secret instead (key `talosconfig`).
"""

[notes.Talos]
    title = "Talos 1.14"
    description = """\
CABPT is now compatible with Talos v1.14.0+. Configurations without a `talosVersion` are
generated for Talos 1.14 and use the multi-document Kubernetes, discovery and identity
configuration; pin `talosVersion` on configs that target older nodes.
On Talos 1.14 contracts the resolved installer image is rendered as an
UnattendedInstallConfig document (disk selector `system_disk`; patch the document to
change it). In-place upgrades of Talos 1.13+ nodes go through the lifecycle service.
"""

[notes.api]
    title = "API"
    description = """\
`status.deprecated.v1beta1` is removed from TalosConfig: only the v1beta2 conditions and
`status.initialization` remain. v1alpha3 clients still see old-shape conditions, derived
from the v1beta2 ones.
"""

preface = """\
"""
