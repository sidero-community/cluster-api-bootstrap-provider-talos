    name: v1beta1
    schema:
      openAPIV3Schema:
        description: TalosConfigTemplate is the Schema for the talosconfigtemplates
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TalosConfigTemplateSpec defines the desired state of TalosConfigTemplate
            properties:
              template:
                description: TalosConfigTemplateResource defines the Template structure
                properties:
                  metadata:
                    description: |-
                      ObjectMeta is the standard object's metadata applied to the TalosConfigs generated from
                      this template. Only labels and annotations are carried over.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/metadata/
                    minProperties: 1
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          annotations is an unstructured key value map stored with a resource that may be
                          set by external tools to store and retrieve arbitrary metadata. They are not
                          queryable and should be preserved when modifying objects.
                          More info: http://kubernetes.io/docs/user-guide/annotations
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          labels is a map of string keys and values that can be used to organize and categorize
                          (scope and select) objects. May match selectors of replication controllers
                          and services.
                          More info: http://kubernetes.io/docs/user-guide/labels
                        type: object
                    type: object
                  spec:
                    description: TalosConfigSpec defines the desired state of TalosConfig
                    properties:
                      configPatches:
                        description: RFC6902 JSON patches to apply to machine configuration.
                        items:
                          properties:
                            op:
                              type: string
                            path:
                              type: string
                            value:
                              x-kubernetes-preserve-unknown-fields: true
                          required:
                          - op
                          - path
                          type: object
                        type: array
                      data:
                        description: Machine configuration in case generateType=none.
                        type: string
                      generateType:
                        description: |-
                          Talos machine configuration type to generate: Supported values are:
                          controlplane, worker, init (deprecated), none (configuration must be then provided in data field).
                        enum:
                        - controlplane
                        - worker
                        - init
                        - none
                        type: string
                      hostname:
                        description: Set hostname in the machine configuration to
                          some value.
                        properties:
                          source:
                            description: |-
                              Source of the hostname.

                              Allowed values:
                              "MachineName" (use linked Machine's Name).
                              "InfrastructureName" (use linked Machine's infrastructure's name).
                            type: string
                        type: object
                      imageFactory:
                        description: |-
                          ImageFactory declares the Talos Image Factory schematic the machine installs and
                          upgrades with. When set, CABPT registers the schematic with the Factory and renders
                          machine.install.image as <factory>/metal-installer/<schematic>:<version>.
                        properties:
                          bootloader:
                            description: Bootloader selects the bootloader of the
                              disk image; the Factory default when empty.
                            enum:
                            - auto
                            - dual-boot
                            - grub
                            - sd-boot
                            type: string
                          extensions:
                            description: |-
                              Extensions are official system extension names, e.g. siderolabs/nvme-cli. The
                              Factory picks the extension versions matching the Talos version.
                            items:
                              type: string
                            type: array
                          extraKernelArgs:
                            description: ExtraKernelArgs are baked into the images
                              the Factory builds from the schematic.
                            items:
                              type: string
                            type: array
                          overlay:
                            description: Overlay selects a single-board-computer overlay.
                            properties:
                              image:
                                description: Image is the overlay container image,
                                  e.g. ghcr.io/siderolabs/sbc-raspberrypi.
                                minLength: 1
                                type: string
                              name:
                                description: Name is the overlay name, e.g. rpi_generic.
                                minLength: 1
                                type: string
                            required:
                            - image
                            - name
                            type: object
                        type: object
