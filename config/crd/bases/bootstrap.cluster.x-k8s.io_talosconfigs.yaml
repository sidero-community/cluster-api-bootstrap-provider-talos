                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dataSecretName:
                description: DataSecretName is the name of the secret that stores
                  the bootstrap data script.
                maxLength: 253
                minLength: 1
                type: string
              imageFactory:
                description: ImageFactory records the schematic resolved from spec.imageFactory.
                properties:
                  installerImage:
                    description: InstallerImage is the machine.install.image rendered
                      into the configuration.
                    type: string
                  observedInputs:
                    description: |-
                      ObservedInputs is a hash of spec.talosVersion and spec.imageFactory. While it matches
                      the current spec the fields above are reused without asking the Factory.
                    type: string
                  schematicID:
                    description: SchematicID is the content-addressed ID the Factory
                      returned.
                    type: string
                  talosVersion:
                    description: TalosVersion is the full version the installer image
                      is tagged with.
                    type: string
                type: object
              initialization:
                description: |-
                  initialization provides observations of the TalosConfig initialization process.
                  NOTE: Fields in this struct are part of the Cluster API contract and are used to orchestrate initial Machine provisioning.
                minProperties: 1
                properties:
                  dataSecretCreated:
                    description: |-
                      dataSecretCreated is true when the Machine's bootstrap secret is created.
                      NOTE: this field is part of the Cluster API contract, and it is used to orchestrate initial Machine provisioning.
                    type: boolean
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest generation observed by the controller.
                  kubebuilder:validation:Minimum=1
                format: int64
                type: integer
            type: object
        type: object
