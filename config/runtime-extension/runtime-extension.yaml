# Manifests for the in-place update Runtime Extension served by CABPT.
#
# These ship in the default kustomization because --enable-runtime-extension defaults to on,
# and the manager exits if its serving certificate is missing.
#
# Serving the hooks is inert on its own. Cluster API only calls them once the RuntimeSDK and
# InPlaceUpdates feature gates are enabled on the core controllers; until then the
# ExtensionConfig below is simply never discovered. See docs/in-place-updates.md.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: runtime-extension-cert
  namespace: system
spec:
  # $(RUNTIME_EXTENSION_SERVICE_NAME) and $(SERVICE_NAMESPACE) are substituted by kustomize,
  # and resolve to the name-prefixed Service below.
  dnsNames:
    - $(RUNTIME_EXTENSION_SERVICE_NAME).$(SERVICE_NAMESPACE).svc
    - $(RUNTIME_EXTENSION_SERVICE_NAME).$(SERVICE_NAMESPACE).svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: $(RUNTIME_EXTENSION_SERVICE_NAME)-cert
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-extension-service
  namespace: system
spec:
  selector:
    # Must match the manager Deployment's pod labels.
    control-plane: controller-manager
  ports:
    - port: 443
      targetPort: runtime-ext
      protocol: TCP
      name: https
---
apiVersion: runtime.cluster.x-k8s.io/v1beta2
kind: ExtensionConfig
metadata:
  name: talos-in-place-updates
  annotations:
    # cert-manager injects the CA so the Cluster API controllers trust this server.
    cert-manager.io/inject-ca-from: $(SERVICE_NAMESPACE)/$(RUNTIME_EXTENSION_CERT_NAME)
spec:
  clientConfig:
    service:
      name: $(RUNTIME_EXTENSION_SERVICE_NAME)
      # ExtensionConfig is cluster scoped, so kustomize's namespace transformer does not reach
      # this field: it has to be substituted explicitly.
      namespace: $(SERVICE_NAMESPACE)
      port: 443
  # Empty selector: serve every namespace. Narrow this if the extension should only apply to
  # some clusters.
  namespaceSelector: {}
