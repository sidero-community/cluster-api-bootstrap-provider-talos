# Manifests for the in-place update Runtime Extension served by CABPT.
#
# These ship in the default kustomization because --enable-runtime-extension defaults to on,
# and the manager exits if its serving certificate is missing.
#
# The ExtensionConfig that registers this server is deliberately NOT here. It is cluster scoped,
# so neither clusterctl nor the Cluster API operator rewrites the install namespace inside
# spec.clientConfig.service, and cert-manager cannot inject a CA into it. A manifest would
# therefore point at the wrong namespace with an empty caBundle, which crash-loops the core
# Cluster API manager because registry warmup treats a non-discoverable extension as fatal.
# The manager writes it instead, from its own namespace and mounted CA.
#
# Serving the hooks is inert on its own. Cluster API only calls them once the RuntimeSDK and
# InPlaceUpdates feature gates are enabled on the core controllers. See docs/in-place-updates.md.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: runtime-extension-cert
  namespace: system
spec:
  # $(RUNTIME_EXTENSION_SERVICE_NAME) and $(SERVICE_NAMESPACE) are substituted by kustomize,
  # and resolve to the name-prefixed Service below.
  dnsNames:
    - $(RUNTIME_EXTENSION_SERVICE_NAME).$(SERVICE_NAMESPACE).svc
    - $(RUNTIME_EXTENSION_SERVICE_NAME).$(SERVICE_NAMESPACE).svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: $(RUNTIME_EXTENSION_SERVICE_NAME)-cert
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-extension-service
  namespace: system
spec:
  selector:
    # Must match the manager Deployment's pod labels.
    control-plane: controller-manager
  ports:
    - port: 443
      targetPort: runtime-ext
      protocol: TCP
      name: https
