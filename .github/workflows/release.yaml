# Unlike ci.yaml, this file is not generated by kres: the upstream pipeline targets Sidero
# Labs' self-hosted runner group, which this fork has no access to.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
"on":
  push:
    tags:
      - v*
name: release
permissions:
  contents: write
  packages: write
env:
  REGISTRY: ghcr.io
  # The Makefile defaults this with ?=, so an ambient USERNAME in the environment would
  # otherwise win and publish the release under the wrong org.
  USERNAME: sidero-community
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup-qemu
        uses: docker/setup-qemu-action@v4
      - name: setup-buildx
        uses: docker/setup-buildx-action@v4
      - name: login-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: container
        run: |
          make container \
            PUSH=true \
            PLATFORM=linux/amd64,linux/arm64 \
            TAG=${{ github.ref_name }}
      - name: release-manifests
        run: make release-manifests TAG=${{ github.ref_name }}
      # Renders hack/release.toml with the Sidero release tool, so the release carries the
      # curated notes rather than GitHub's generated changelog link.
      - name: release-notes
        run: make release-notes TAG=${{ github.ref_name }}
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: _out/bootstrap-talos/${{ github.ref_name }}/*
          body_path: _out/RELEASE_NOTES.md
          draft: false
          prerelease: false
